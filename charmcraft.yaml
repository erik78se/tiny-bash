name: tiny-bash
type: charm
title: A tiny bash charm.
summary: |
  The tiny-bash deploys very fast.
description: |
  The tiny-bash charm that use "hooks only" to deploy. 
  Since its super small and only uses hooks, it deploys very fast

platforms:
  ubuntu@24.04:amd64:
  ubuntu@22.04:amd64:
  ubuntu@20.04:amd64:
  ubuntu@18.04:amd64:

config:
  options: {}


parts:
  tiny-bash:
    plugin: dump
    source: .
    prime:
      - LICENSE
      - README.md
      - copyright
      - hooks
      - icon.svg
