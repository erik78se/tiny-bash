name: tiny-bash
type: charm
title: A tiny bash charm.
summary: |
  The tiny-bash deploys very fast.
description: |
  The tiny-bash charm that use "hooks only" to deploy. 
  Since its super small and only uses hooks, it deploys very fast

bases:
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
    run-on:
    - name: "ubuntu"
      channel: "24.04"
    - name: "ubuntu"
      channel: "22.04"
    - name: "ubuntu"
      channel: "20.04"
    - name: "ubuntu"
      channel: "18.04"

config:
  options: {}


parts:
  tiny-bash:
    plugin: dump
    source: .
    prime:
      - LICENSE
      - README.md
      - copyright
      - hooks
      - icon.svg
